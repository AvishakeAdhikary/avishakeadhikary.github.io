# Test, build and deploy the static site to GitHub Pages.
#
# Runs on every push to main, on manual dispatch, and monthly on a schedule.
# Each run refreshes live data first (GitHub repos + Google Scholar), so the
# deployed site is always current without anyone committing anything.
# If a data source is down, the committed snapshot is used (the build never
# fails because of it).
#
# Nothing deploys unless every gate is green:
#   check   lint (zero warnings), types, unit tests, npm audit (zero findings)
#   build   sync + static export
#   e2e     Playwright on the export in Chromium, Firefox and WebKit: every
#           route at three widths, overlays, keybinds, audio, games, a11y,
#           and a silent console (any error or warning fails)
#   dev     the same pages under `next dev`, where React reports dev-only
#           problems (duplicate keys, update loops, hydration mismatches)
# After deploying, `live` smoke-tests the real URL.
name: Deploy site

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *" # 03:17 UTC on the 1st of every month

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Lint, types, unit tests, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm audit --audit-level=low

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v6
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - name: Sync live data (GitHub + Scholar)
        run: npm run sync
        env:
          GITHUB_TOKEN: ${{ secrets.PORTFOLIO_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm run build
      - name: Keep the export for the browser tests
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: out
          retention-days: 3
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: out
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Virtual sound card and software GL (CI machines have neither)
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio libgl1-mesa-dri libegl1 libgles2 xvfb
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
          pactl set-default-sink ci
      # Firefox only gets WebGL with a display: run it headed on a virtual X server
      # (software GL), like a desktop Firefox. The others stay headless.
      - if: matrix.browser == 'firefox'
        run: xvfb-run --auto-servernum -- npx playwright test --project=firefox --headed
      - if: matrix.browser != 'firefox'
        run: npx playwright test --project=${{ matrix.browser }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.browser }}
          path: test-results
          retention-days: 7

  dev:
    name: E2E (next dev)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=dev
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-dev
          path: test-results
          retention-days: 7

  deploy:
    name: Deploy
    needs: [e2e, dev]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  live:
    name: Live smoke test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=live
